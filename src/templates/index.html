<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .result-box { display: none; margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
        .qr-code { max-width: 200px; margin: 20px auto; }
        .stats { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="stats text-center">
                    <h1>🚀 URL Shortener Pro</h1>
                    <p>Shorten, Track, and Analyze your URLs</p>
                </div>
                
                <div class="card">
                    <div class="card-body">
                        <form id="shortenForm">
                            <div class="mb-3">
                                <label for="longUrl" class="form-label">Enter Long URL</label>
                                <input type="url" class="form-control" id="longUrl" required placeholder="https://example.com/very/long/url">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Service</label>
                                <select class="form-select" id="service">
                                    <option value="tinyurl">TinyURL</option>
                                    <option value="bitly">Bitly</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="customCode" class="form-label">Custom Code (Optional)</label>
                                <input type="text" class="form-control" id="customCode" placeholder="my-custom-url">
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Shorten URL</button>
                        </form>
                        
                        <div id="result" class="result-box">
                            <h5>Success! 🎉</h5>
                            <p><strong>Short URL:</strong> <a href="#" id="shortUrl" target="_blank"></a></p>
                            <p><strong>Original URL:</strong> <span id="longUrlDisplay"></span></p>
                            <div class="text-center">
                                <img id="qrCode" class="qr-code" alt="QR Code">
                            </div>
                            <a href="#" id="analyticsLink" class="btn btn-info btn-sm">View Analytics</a>
                            <button onclick="copyToClipboard()" class="btn btn-secondary btn-sm">Copy to Clipboard</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('shortenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('long_url', document.getElementById('longUrl').value);
            formData.append('service', document.getElementById('service').value);
            formData.append('custom_code', document.getElementById('customCode').value);
            
            const response = await fetch('/shorten', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.error) {
                alert('Error: ' + data.error);
                return;
            }
            
            document.getElementById('shortUrl').href = data.short_url;
            document.getElementById('shortUrl').textContent = data.short_url;
            document.getElementById('longUrlDisplay').textContent = data.long_url;
            document.getElementById('qrCode').src = data.qr_code;
            document.getElementById('analyticsLink').href = data.analytics_url;
            document.getElementById('result').style.display = 'block';
        });
        
        function copyToClipboard() {
            const url = document.getElementById('shortUrl').textContent;
            navigator.clipboard.writeText(url);
            alert('Copied to clipboard!');
        }
    </script>
</body>
</html>
